<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Barang Lab - Lab Inventaris SMK</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-box-seam me-2"></i>Lab Inventaris SMK
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i> Data Barang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tambah.html"><i class="bi bi-plus-circle me-1"></i> Tambah Barang</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENT WRAPPER -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h4 class="fw-bold mb-1">Form Edit Data Barang Lab</h4>
                        <p class="text-muted small mb-0">Template statis mentah form edit barang</p>
                    </div>
                    <a href="index.html" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Kembali ke Daftar
                    </a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h6 class="card-title mb-0 fw-semibold text-warning">
                            <i class="bi bi-pencil-square me-1"></i> Perbarui Data Barang (LAB-001)
                        </h6>
                    </div>
                    <div class="card-body p-4">
                        <form action="#" method="POST">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Kode Barang <span class="text-danger">*</span></label>
                                    <input type="text" name="kode_barang" class="form-control" value="LAB-001" required>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label fw-semibold">Nama Barang <span class="text-danger">*</span></label>
                                    <input type="text" name="nama_barang" class="form-control" value="PC All-in-One Core i5" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Kategori <span class="text-danger">*</span></label>
                                    <select name="kategori" class="form-select" required>
                                        <option value="Komputer" selected>Komputer</option>
                                        <option value="Jaringan">Jaringan</option>
                                        <option value="Peralatan">Peralatan Praktek</option>
                                        <option value="Furnitur">Furnitur / Meja Kursi</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Jumlah Stok <span class="text-danger">*</span></label>
                                    <input type="number" name="stok" class="form-control" value="24" min="0" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Kondisi <span class="text-danger">*</span></label>
                                    <select name="kondisi" class="form-select" required>
                                        <option value="Baik" selected>Baik</option>
                                        <option value="Rusak Ringan">Rusak Ringan</option>
                                        <option value="Rusak Berat">Rusak Berat</option>
                                    </select>
                                </div>
                            </div>
                            <hr class="my-4">
                            <div class="d-flex justify-content-end gap-2">
                                <a href="index.html" class="btn btn-light border">Batal</a>
                                <button type="button" class="btn btn-warning px-4 text-white">
                                    <i class="bi bi-check-lg me-1"></i> Update Data
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 mt-5">
        <div class="container text-center text-muted small">
            &copy; 2026 Lab Inventaris SMK — Praktik Pemrograman Web & Framework Laravel
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
